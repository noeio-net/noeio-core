[package]
name = "noeio"
version = "0.3.0"
edition = "2024"

[dependencies]
noeio-common = { workspace = true }
noeio-proto = { workspace = true, features = ["noeio"] }
noeio-net-route = { workspace = true }
uuid = { workspace = true }
tun = { workspace = true, features = ["async"] }
tokio = { workspace = true, features = ["full"] }
clap = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
smoltcp = { workspace = true }
x25519-dalek = { workspace = true, features = ["getrandom"] }
boringtun = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
stun_codec = { workspace = true }
rand = { workspace = true, features = ["std"] }
bytecodec = { workspace = true }
tonic = { workspace = true, features = ["default"] }
tokio-stream = { workspace = true, features = ["net"] }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
dashmap = { workspace = true }
tower = { workspace = true }
hyper-util = { workspace = true }
async-trait = { workspace = true }

# pnet links against Npcap's Packet.lib on Windows; only the Unix build uses it.
[target.'cfg(unix)'.dependencies]
pnet = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
