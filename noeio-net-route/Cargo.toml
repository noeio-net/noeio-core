[package]
name = "noeio-net-route"
version = "0.3.0"
edition = "2024"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
net-route = "0.4.6"

# nf_tables over netlink (Linux only). Pinned: 0.3 / 0.4 shipped a month apart
# after two idle years, so upgrades need a manual API check.
[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-netfilter = "=0.4.0"
netlink-packet-core = "0.9.0"
netlink-sys = "0.9.0"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
